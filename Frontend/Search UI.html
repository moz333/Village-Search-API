<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Village Search Portal</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    min-height:100vh;
    background:
        linear-gradient(
            135deg,
            #0f172a 0%,
            #111827 35%,
            #1e293b 100%
        );

    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px 20px;
    color:white;
}

.container{
    width:100%;
    max-width:1100px;

    background:rgba(255,255,255,0.08);

    border:1px solid rgba(255,255,255,0.12);

    backdrop-filter:blur(18px);

    border-radius:28px;

    padding:40px;

    box-shadow:
        0 10px 40px rgba(0,0,0,0.35);
}

/* HEADER */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:40px;
    flex-wrap:wrap;
    gap:20px;
}

.logo-section h1{
    font-size:36px;
    font-weight:700;
    margin-bottom:8px;
}

.logo-section p{
    color:#cbd5e1;
    font-size:15px;
}

.badge{
    background:#2563eb;
    padding:10px 18px;
    border-radius:999px;
    font-size:14px;
    font-weight:600;
}

/* SEARCH SECTION */

.search-section{
    display:grid;
    grid-template-columns:1fr auto;
    gap:15px;
    margin-bottom:35px;
}

.search-box{
    position:relative;
}

.search-box input{
    width:100%;
    padding:18px 20px;
    border-radius:16px;
    border:none;
    outline:none;
    background:rgba(255,255,255,0.1);
    color:white;
    font-size:16px;
    border:1px solid transparent;
    transition:0.3s ease;
}

.search-box input:focus{
    border-color:#3b82f6;
    background:rgba(255,255,255,0.14);
}

.search-box input::placeholder{
    color:#94a3b8;
}

.search-btn{
    padding:18px 28px;
    border:none;
    border-radius:16px;
    background:linear-gradient(
        135deg,
        #3b82f6,
        #2563eb
    );

    color:white;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s ease;
}

.search-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 25px rgba(59,130,246,0.4);
}

/* FILTER SECTION */

.filter-card{
    background:rgba(255,255,255,0.06);
    border-radius:22px;
    padding:28px;
    border:1px solid rgba(255,255,255,0.08);
}

.filter-title{
    font-size:20px;
    font-weight:600;
    margin-bottom:24px;
}

.filters{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.select-group{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.select-group label{
    font-size:14px;
    color:#cbd5e1;
    font-weight:500;
}

select{
    width:100%;
    padding:16px;
    border-radius:14px;
    border:none;
    outline:none;
    background:rgba(255,255,255,0.08);
    color:white;
    font-size:15px;
    border:1px solid rgba(255,255,255,0.08);
    cursor:pointer;
    transition:0.3s ease;
}

select:focus{
    border-color:#3b82f6;
}

option{
    color:black;
}

/* RESULTS */

.results{
    margin-top:40px;
}

.results-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.results-header h2{
    font-size:24px;
}

.results-count{
    color:#94a3b8;
    font-size:14px;
}

.results-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:20px;
}

.card{
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:22px;
    padding:24px;
    transition:0.3s ease;
    position:relative;
    overflow:hidden;
}

.card:hover{
    transform:translateY(-5px);
    border-color:#3b82f6;
    box-shadow:0 15px 30px rgba(0,0,0,0.25);
}

.card::before{
    content:'';
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:4px;
    background:linear-gradient(
        90deg,
        #3b82f6,
        #60a5fa
    );
}

.card h3{
    font-size:22px;
    margin-bottom:18px;
}

.info-row{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid rgba(255,255,255,0.06);
}

.info-row:last-child{
    border-bottom:none;
}

.label{
    color:#94a3b8;
    font-size:14px;
}

.value{
    font-weight:500;
}

/* RESPONSIVE */

@media(max-width:768px){

    .container{
        padding:25px;
    }

    .header{
        flex-direction:column;
        align-items:flex-start;
    }

    .search-section{
        grid-template-columns:1fr;
    }

    .logo-section h1{
        font-size:28px;
    }

}

</style>
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <div class="header">

        <div class="logo-section">
            <h1>Village Search</h1>
            <p>India Administrative Location Search Portal</p>
        </div>

        <div class="badge">
            Secure API Connected
        </div>

    </div>

    <!-- SEARCH -->
    <div class="search-section">

        <div class="search-box">
            <input
                type="text"
                id="searchInput"
                placeholder="Search villages, districts, states..."
            />
        </div>

        <button class="search-btn" onclick="searchVillage()">
            Search
        </button>

    </div>

    <!-- FILTERS -->
    <div class="filter-card">

        <div class="filter-title">
            Browse by Administrative Hierarchy
        </div>

        <div class="filters">

            <div class="select-group">
                <label>State</label>
                <select id="stateSelect" onchange="loadDistricts()">
                    <option value="">Select State</option>
                </select>
            </div>

            <div class="select-group">
                <label>District</label>
                <select id="districtSelect" onchange="loadSubdistricts()">
                    <option value="">Select District</option>
                </select>
            </div>

            <div class="select-group">
                <label>Subdistrict</label>
                <select id="subdistrictSelect" onchange="loadVillages()">
                    <option value="">Select Subdistrict</option>
                </select>
            </div>

            <div class="select-group">
                <label>Village</label>
                <select id="villageSelect">
                    <option value="">Select Village</option>
                </select>
            </div>

        </div>

    </div>

    <!-- RESULTS -->
    <div class="results">

        <div class="results-header">
            <h2>Search Results</h2>
            <div class="results-count" id="resultsCount">
                0 Results
            </div>
        </div>

        <div class="results-grid" id="results"></div>

    </div>

</div>

<script>

const API_KEY = "abc123";
const BASE_URL = "http://127.0.0.1:8000";


// -----------------------------
// LOAD STATES
// -----------------------------
async function loadStates() {

    const response = await fetch(`${BASE_URL}/states`, {
        headers: {
            "x-api-key": API_KEY
        }
    });

    const data = await response.json();

    const stateSelect =
        document.getElementById("stateSelect");

    data.forEach(state => {

        const option =
            document.createElement("option");

        option.value = state.id;
        option.textContent = state.name;

        stateSelect.appendChild(option);
    });
}


// -----------------------------
// LOAD DISTRICTS
// -----------------------------
async function loadDistricts() {

    const stateId =
        document.getElementById("stateSelect").value;

    const districtSelect =
        document.getElementById("districtSelect");

    districtSelect.innerHTML =
        '<option value="">Select District</option>';

    const response = await fetch(
        `${BASE_URL}/districts?state_id=${stateId}`,
        {
            headers: {
                "x-api-key": API_KEY
            }
        }
    );

    const data = await response.json();

    data.forEach(district => {

        const option =
            document.createElement("option");

        option.value = district.id;
        option.textContent = district.name;

        districtSelect.appendChild(option);
    });
}


// -----------------------------
// LOAD SUBDISTRICTS
// -----------------------------
async function loadSubdistricts() {

    const districtId =
        document.getElementById("districtSelect").value;

    const subdistrictSelect =
        document.getElementById("subdistrictSelect");

    subdistrictSelect.innerHTML =
        '<option value="">Select Subdistrict</option>';

    const response = await fetch(
        `${BASE_URL}/subdistricts?district_id=${districtId}`,
        {
            headers: {
                "x-api-key": API_KEY
            }
        }
    );

    const data = await response.json();

    data.forEach(subdistrict => {

        const option =
            document.createElement("option");

        option.value = subdistrict.id;
        option.textContent = subdistrict.name;

        subdistrictSelect.appendChild(option);
    });
}


// -----------------------------
// LOAD VILLAGES
// -----------------------------
async function loadVillages() {

    const subdistrictId =
        document.getElementById("subdistrictSelect").value;

    const villageSelect =
        document.getElementById("villageSelect");

    villageSelect.innerHTML =
        '<option value="">Select Village</option>';

    const response = await fetch(
        `${BASE_URL}/villages?subdistrict_id=${subdistrictId}`,
        {
            headers: {
                "x-api-key": API_KEY
            }
        }
    );

    const data = await response.json();

    data.forEach(village => {

        const option =
            document.createElement("option");

        option.value = village.id;
        option.textContent = village.name;

        villageSelect.appendChild(option);
    });
}


// -----------------------------
// SEARCH API
// -----------------------------
async function searchVillage() {

    const query =
        document.getElementById("searchInput").value;

    const response = await fetch(
        `${BASE_URL}/search?q=${query}`,
        {
            headers: {
                "x-api-key": API_KEY
            }
        }
    );

    const data = await response.json();

    const resultsDiv =
        document.getElementById("results");

    const resultsCount =
        document.getElementById("resultsCount");

    resultsDiv.innerHTML = "";

    resultsCount.innerText =
        `${data.length} Results`;

    data.forEach(item => {

        const card =
            document.createElement("div");

        card.className = "card";

        card.innerHTML = `

            <h3>${item.village}</h3>

            <div class="info-row">
                <span class="label">Subdistrict</span>
                <span class="value">${item.subdistrict}</span>
            </div>

            <div class="info-row">
                <span class="label">District</span>
                <span class="value">${item.district}</span>
            </div>

            <div class="info-row">
                <span class="label">State</span>
                <span class="value">${item.state}</span>
            </div>

        `;

        resultsDiv.appendChild(card);
    });
}


// INITIAL LOAD
loadStates();

</script>

</body>
</html>
